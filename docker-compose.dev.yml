services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "${DBPORT:-5435}:5432"
    volumes:
      - tour_data_pg17:/var/lib/postgresql/data
    networks:
      - tour_network

  app:
    build: .
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      - VERSION=1.0.0
      - SERVICE_NAME=Tour App
      - HTTP_PORT=3000
      - JWT_SECRET_KEY=my_secret_key
      - DBHOST=postgres
      - DBPORT=5432
      - DBUSER=postgres
      - DBPASSWORD=password
      - DBNAME=mydb
      - ENABLE_SSL_MODE=false
    depends_on:
      - postgres
    volumes:
      - app_uploads:/app/images
    networks:
      - tour_network

  

volumes:
  # Retain the PostgreSQL 15 volume for rollback after migration.
  tour_data:
  tour_data_pg17:
  app_uploads:


networks:
  tour_network:
    driver: bridge
