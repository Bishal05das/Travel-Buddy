services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
      POSTGRES_DB: ${DBNAME}
    ports:
      - "${DBPORT}:5432"
    volumes:
      - tour_data_pg17:/var/lib/postgresql/data
    networks:
      - tour_network

  app:
    image: ${APP_IMAGE}
    depends_on:
      - postgres
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    env_file:
      - .env
    networks:
      - tour_network



volumes:
  # Retain the PostgreSQL 15 volume for rollback after migration.
  tour_data:
  tour_data_pg17:

networks:
  tour_network:
    driver: bridge
